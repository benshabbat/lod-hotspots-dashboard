<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>מוקד רואה וביטחון עירוני - לוד | מפת נקודות חמות - מבצע יום הכיפורים</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📍</text></svg>">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800;900&family=Rubik:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

  <div class="app-root">

    <!-- Header -->
    <header class="app-header">
      <div class="header-right">
        <div class="city-logo">עיריית לוד</div>
        <div class="header-titles">
          <h1>מפת נקודות חמות ואירועים חריגים</h1>
          <p id="headerSubtitle">מוקד רואה וביטחון עירוני | סיכום מבצע יום הכיפורים 2026 (ערב ומהלך החג)</p>
        </div>
      </div>
      <div class="header-left">
        <div class="year-switcher" role="group" aria-label="בחירת שנת הדוח">
          <button class="year-btn active" id="yearBtn2026" onclick="switchYear('2026')" aria-pressed="true">2026</button>
          <button class="year-btn" id="yearBtn2025" onclick="switchYear('2025')" aria-pressed="false">2025</button>
        </div>
        <button class="btn-header desktop-only" onclick="fitLodBounds()">📍 מרכוז לוד</button>
        <button class="btn-header desktop-only" onclick="window.print()">🖨️ הדפסה</button>
        <button class="btn-header btn-whatsapp" onclick="shareSummaryWhatsApp()">💬 שיתוף</button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="app-main">

      <!-- Map View -->
      <div class="map-view" id="mapViewTab">
        <div id="map" dir="ltr"></div>

        <!-- Filter Chips Carousel -->
        <div class="chips-carousel" id="filterChips"></div>

        <!-- Desktop Floating Legend -->
        <div class="legend-card" id="desktopLegend">
          <h3 id="legendTitle">מקרא סמלים - 2026</h3>
          <div id="legendItems"></div>
          <div class="legend-line" style="margin-top:4px; padding-top:4px; border-top:1px dashed #cbd5e1;">
            <span>גבול שיפוט העיר לוד</span>
            <div style="width:26px; height:4px; background:#0084ff; border-radius:2px; box-shadow:0 0 6px #0084ff;"></div>
          </div>
        </div>
      </div>

      <!-- Side Table Panel (Desktop / Mobile Tab) -->
      <aside class="sidebar-view" id="sidebarViewTab">
        <div class="sidebar-header">
          <div class="sidebar-header-top">
            <h2 id="sidebarTitle">📋 אירועים – יום הכיפורים 2026</h2>
            <span class="visible-counter" id="visibleCounter">מציג 11 מתוך 11</span>
          </div>
          <p>לחיצה על שורה מדגישה אותה וממקדת את המפה עם ניווט מהיר</p>
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="חיפוש רחוב, אירוע או שכונה (איילון, שלמה המלך, סוס, חסימה)..." oninput="handleSearch(this.value)">
            <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
          </div>
        </div>

        <div class="tables-scroll-container" id="tablesContainer">
          <!-- Dynamically populated or grouped categories -->
        </div>
      </aside>

    </main>

    <!-- Mobile Drawer for Selected Incident -->
    <div class="mobile-drawer" id="mobileDrawer">
      <button class="drawer-close" onclick="closeDrawer()">✕</button>
      <div class="drawer-title" id="drawerTitle"></div>
      <div class="drawer-loc" id="drawerLoc"></div>
      <div class="drawer-desc" id="drawerDesc"></div>
      <div class="drawer-actions">
        <a href="#" id="drawerGmapsBtn" target="_blank" class="drawer-btn">📍 Google Maps</a>
        <a href="#" id="drawerWazeBtn" target="_blank" class="drawer-btn waze">🚗 Waze</a>
      </div>
    </div>

    <!-- Mobile Tab Bar -->
    <nav class="mobile-tab-bar">
      <button class="tab-btn active" id="tabBtnMap" onclick="switchTab('map')">
        <span class="tab-icon">🗺️</span>
        <span>מפה</span>
      </button>
      <button class="tab-btn" id="tabBtnList" onclick="switchTab('list')">
        <span class="tab-icon">📋</span>
        <span id="mobileEventsLabel">אירועים (11)</span>
      </button>
      <button class="tab-btn" id="tabBtnLegend" onclick="switchTab('legend')">
        <span class="tab-icon">ℹ️</span>
        <span>מקרא</span>
      </button>
    </nav>

  </div>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
